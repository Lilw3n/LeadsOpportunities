# n8n chez vous, sans abonnement. L'image community et SQLite ne facturent pas à l'exécution.
# Lancer : ./demarrer.sh  puis ouvrir http://127.0.0.1:5678
services:
  n8n:
    image: n8nio/n8n:1.109.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    volumes:
      - ./data:/home/node/.n8n
      - ./workflows:/files/workflows:ro
