# Instance Oracle Cloud Always Free (0 €), toujours allumée.
# Forme VM.Standard.A1.Flex, 1 OCPU, 6 Go. Lancer : ./serveur.sh
# Le DNS A de N8N_HOST doit pointer vers cette instance.
services:
  n8n:
    image: n8nio/n8n:1.109.2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    volumes:
      - ./data:/home/node/.n8n
      - ./workflows:/files/workflows:ro
    expose:
      - "5678"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_HOST: ${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
