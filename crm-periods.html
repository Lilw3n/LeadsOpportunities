<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Périodes assurance | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Assurance métier</p>
      <h2>Périodes et renouvellements</h2>
      <p>Suivez les échéances, les contrats à renouveler sous 90 jours et reliez-les aux alertes intelligentes du CRM.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-intelligent-alerts.html" class="btn btn-primary">Alertes</a>
      <a href="./crm-contracts.html" class="btn btn-ghost">Contrats</a>
      <a href="./crm-period-new.html" class="btn btn-ghost">+ Période</a>
    </div>
  </section>

  <div id="periodKpis" class="crm-kpis" style="margin-bottom:16px"></div>
  <p style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px">
    <button type="button" class="btn btn-ghost btn-sm" id="btnPeriodNotify">Rappels renouvellement</button>
  </p>
  <div id="periodNotifyBox" class="panel hidden" style="margin-bottom:16px;padding:14px"></div>
  <div id="periodAlert" class="panel" style="margin-bottom:16px;display:none;background:#fef3c7;border-color:#fcd34d"></div>

  <section class="crm-page-panel">
    <div class="crm-section-head">
      <div><p class="crm-eyebrow">Suivi</p><h2>Liste des périodes</h2></div>
    </div>
    <div id="periodsMount" class="panel"></div>
  </section>

  <section class="crm-page-panel">
    <div class="crm-section-head">
      <div><p class="crm-eyebrow">Renouvellement</p><h2>Contrats à renouveler (90 jours)</h2></div>
    </div>
    <div id="expiringMount" class="panel"></div>
  </section>

  <section class="crm-page-panel">
    <div class="crm-section-head">
      <div><p class="crm-eyebrow">Historique</p><h2>Activité récente</h2></div>
    </div>
    <div id="activityMount" style="font-size:.9rem;color:var(--muted)"></div>
  </section>

  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-periods.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
