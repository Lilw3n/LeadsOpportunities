<!doctype html>

<html lang="fr">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Déclarer un sinistre | Espace client</title>

  <link rel="stylesheet" href="../landings/styles.css" />

  <style>

    .form-page { max-width:560px; margin:0 auto; padding:24px; }

    .form-page label { display:block; margin-top:12px; font-weight:600; font-size:.9rem; }

    .form-page input, .form-page select, .form-page textarea { width:100%; margin-top:6px; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box; }

    .btn-submit { margin-top:20px; padding:14px; width:100%; background:#6366f1; color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer; }

    .doc-check { font-weight:400; font-size:.88rem; display:flex; gap:8px; align-items:flex-start; margin-top:8px; }

    .doc-check input { width:auto; margin-top:4px; }

  </style>

</head>

<body class="landing-page">

  <div class="form-page">

    <a href="dashboard.html">← Mon espace</a>

    <h1>Déclarer un sinistre</h1>

    <p style="color:#64748b">Inspire ClaimForm multisite — transmission immédiate au CRM courtier</p>
    <p style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;font-size:.88rem;margin:12px 0">
      <strong>Urgence 24h/24 :</strong> en cas de blessés, appelez le <a href="tel:15">15</a> ou le <a href="tel:112">112</a> avant de remplir ce formulaire.
    </p>

    <form id="claimForm">

      <label>Type de sinistre<select name="claimType" required>

        <option value="Accident">Accident</option>

        <option value="Bris de glace">Bris de glace</option>

        <option value="Vol">Vol</option>

        <option value="Dégâts des eaux">Dégâts des eaux</option>

        <option value="Incendie">Incendie</option>

        <option value="Autre">Autre</option>

      </select></label>

      <label>Date<input type="date" name="claimDate" required /></label>

      <label>Immatriculation véhicule<input name="vehicleRegistration" placeholder="AB-123-CD" /></label>

      <label>Lieu du sinistre<input name="location" placeholder="Ville, adresse…" /></label>

      <label>Tiers impliqué ?<select name="thirdParty"><option value="non">Non</option><option value="oui">Oui</option></select></label>

      <label>Responsable ?<select name="responsible"><option value="non">Non</option><option value="oui">Oui</option><option value="partage">Responsabilité partagée</option></select></label>

      <label>Montant estimé (€)<input type="number" name="amount" min="0" step="0.01" placeholder="Optionnel" /></label>

      <label>Description détaillée<textarea name="description" rows="5" required placeholder="Circonstances, lieu, tiers impliqués…"></textarea></label>

      <fieldset style="margin-top:16px;border:1px solid #e2e8f0;border-radius:10px;padding:12px">

        <legend style="font-weight:600;font-size:.9rem">Documents à joindre ensuite</legend>

        <label class="doc-check"><input type="checkbox" name="docConstat" /> Constat amiable</label>

        <label class="doc-check"><input type="checkbox" name="docPhotos" /> Photos des dégâts</label>

        <label class="doc-check"><input type="checkbox" name="docRapport" /> Rapport police / gendarmerie</label>

        <p style="font-size:.82rem;color:#64748b;margin:8px 0 0"><a href="upload-document.html">Uploader un document →</a></p>

      </fieldset>

      <button type="submit" class="btn-submit">Transmettre au courtier</button>

    </form>

    <p id="claimMsg" style="margin-top:16px"></p>

  </div>

  <script src="claim-declare.js"></script>

</body>

</html>
