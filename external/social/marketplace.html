<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace Pro | Leads Opportunities</title>
  <link rel="stylesheet" href="../../landings/styles.css" />
  <style>
    .mp-wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
    .mp-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .mp-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
    .mp-toolbar input, .mp-toolbar select { padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; }
    .mp-toolbar input { flex: 1; min-width: 200px; }
    .mp-cart-btn { position: relative; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; cursor: pointer; font-weight: 600; }
    .mp-cart-badge { position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; font-size: 0.65rem; min-width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
    .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .mp-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; }
    .mp-card:hover { border-color: #6366f1; box-shadow: 0 8px 24px rgba(99,102,241,.1); }
    .mp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .mp-tag { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
    .mp-tag-hot { background: #fef3c7; color: #b45309; }
    .mp-tag-new { background: #dbeafe; color: #1d4ed8; }
    .mp-tag-sale { background: #fee2e2; color: #b91c1c; }
    .mp-card h3 { margin: 0 0 6px; font-size: 1rem; }
    .mp-card p { margin: 0; color: #64748b; font-size: 0.85rem; flex: 1; line-height: 1.45; }
    .mp-price { font-weight: 800; color: #4338ca; margin: 12px 0; font-size: 1.1rem; }
    .mp-card button { width: 100%; padding: 10px; border: none; border-radius: 10px; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .mp-card button.secondary { background: #f1f5f9; color: #334155; }
    .mp-empty { text-align: center; color: #64748b; padding: 40px 20px; }
    .mp-cart-panel { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 10000; align-items: center; justify-content: center; padding: 16px; }
    .mp-cart-panel.open { display: flex; }
    .mp-cart-box { background: #fff; border-radius: 16px; max-width: 480px; width: 100%; max-height: 85vh; overflow: auto; padding: 24px; }
    .mp-cart-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    .mp-cart-item button { border: none; background: none; color: #b91c1c; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body class="landing-page">
  <div class="mp-wrap">
    <div class="mp-head">
      <div>
        <a href="hub.html" style="font-size: 0.9rem">← Social Hub</a>
        <h1 style="margin: 8px 0 4px">Marketplace Pro</h1>
        <p style="color: #64748b; margin: 0; max-width: 560px">Découvrez des produits et services professionnels — panier, filtres et tri calqués sur <code>/external/social/hub/marketplace</code> multisite.</p>
      </div>
      <button type="button" class="mp-cart-btn" id="btnCart">🛒 Panier <span id="cartCount" class="mp-cart-badge hidden">0</span></button>
    </div>
    <div class="mp-toolbar">
      <input type="search" id="mpSearch" placeholder="Rechercher des produits…" autocomplete="off" />
      <select id="mpCategory"><option value="">Toutes catégories</option></select>
      <select id="mpSort">
        <option value="relevance">Pertinence</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
        <option value="rating">Mieux notés</option>
        <option value="new">Plus récents</option>
        <option value="sales">Plus vendus</option>
      </select>
      <label style="font-size:.85rem;display:flex;align-items:center;gap:6px"><input type="checkbox" id="mpSponsored" /> Sponsorisés</label>
      <label style="font-size:.85rem;display:flex;align-items:center;gap:6px"><input type="checkbox" id="mpWishlistOnly" /> Ma liste</label>
      <input type="number" id="mpMaxPrice" placeholder="Prix max €" min="0" style="width:110px" />
    </div>
    <div id="mpGrid" class="mp-grid"></div>
    <p id="mpEmpty" class="mp-empty hidden">Aucun produit trouvé. Essayez de modifier vos critères de recherche.</p>
  </div>
  <div class="mp-cart-panel" id="cartPanel">
    <div class="mp-cart-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0;font-size:1.15rem">Votre panier</h2>
        <button type="button" id="cartClose" style="border:none;background:none;font-size:1.2rem;cursor:pointer">×</button>
      </div>
      <div id="cartBody"></div>
      <p id="cartTotal" style="font-weight:700;margin:16px 0"></p>
      <label style="font-size:.88rem;display:block;margin-bottom:12px">Code promo<input type="text" id="mpPromo" placeholder="COMMUNAUTE" style="width:100%;padding:8px;margin-top:4px;border:1px solid #e2e8f0;border-radius:8px" /></label>
      <button type="button" id="cartCheckout" style="width:100%;padding:12px;border:none;border-radius:10px;background:#6366f1;color:#fff;font-weight:600;cursor:pointer">Procéder au paiement / devis</button>
      <button type="button" id="cartContinue" style="width:100%;padding:10px;margin-top:8px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer">Continuer les achats</button>
    </div>
  </div>
  <script src="../../js/cookie-banner.js"></script>
  <script src="../../js/external-portal-nav.js"></script>
  <script src="marketplace.js"></script>
</body>
</html>
