<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion portail | Leads Opportunities</title>
  <meta name="description" content="Connexion sécurisée du portail acquéreur / vendeur / visiteur." />
  <link rel="stylesheet" href="../landings/styles.css" />
  <style>
    .auth-page { max-width: 460px; margin: 0 auto; padding: 32px 20px 48px; }
    .auth-back { font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
      color: #312e81;
      font-size: 0.95rem;
    }
    .auth-page h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .auth-lead { color: #64748b; margin: 0 0 20px; line-height: 1.5; }
    .auth-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }
    .auth-box label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #334155; }
    .auth-box input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .auth-box input::placeholder { color: #94a3b8; }
    .auth-demo {
      font-size: 0.82rem;
      color: #475569;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 12px 14px;
      margin: -8px 0 18px;
      line-height: 1.45;
    }
    .auth-error { color: #b91c1c; font-size: 0.9rem; margin-top: 12px; }
    .auth-foot { text-align: center; margin-top: 22px; font-size: 0.95rem; color: #64748b; }
    .auth-foot a { color: #4f46e5; font-weight: 600; }
  </style>
</head>
<body class="landing-page">
  <div class="auth-page">
    <a class="auth-back" href="index.html">← Retour au portail</a>
    <div class="auth-brand"><span aria-hidden="true">🏠</span> Leads Opportunities</div>
    <h1>Connexion client</h1>
    <p class="auth-lead">Accédez à votre espace personnel pour suivre vos visites, votre profil et votre dossier.</p>
    <form id="loginForm" class="auth-box">
      <label for="loginEmail">Adresse email</label>
      <input
        id="loginEmail"
        type="email"
        name="email"
        required
        autocomplete="username"
        placeholder="vous@email.com"
      />
      <label for="loginPassword">Mot de passe</label>
      <input
        id="loginPassword"
        type="password"
        name="password"
        required
        autocomplete="current-password"
        placeholder="Votre mot de passe"
      />
      <div class="auth-demo"><strong>Nouveau :</strong> ce portail utilise maintenant une vraie authentification interne liée à votre dossier CRM.</div>
      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; padding: 14px; background: #6366f1; color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer"
      >
        Se connecter
      </button>
      <p id="loginError" class="auth-error hidden"></p>
    </form>
    <p class="auth-foot">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
  </div>
  <script src="../js/cookie-banner.js"></script>
  <script src="login.js"></script>
</body>
</html>
