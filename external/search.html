<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche dossier | Leads Opportunities</title>
  <link rel="stylesheet" href="../landings/styles.css" />
  <style>
    .sr-wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
    .sr-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .sr-head h1 { margin: 0; font-size: 1.5rem; }
    .sr-query {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    #srMeta { color: #64748b; font-size: .9rem; margin-bottom: 16px; }
    .sr-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    a.sr-card:hover { border-color: #6366f1; box-shadow: 0 6px 20px rgba(99, 102, 241, 0.12); }
    .sr-badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6366f1;
      background: #eef2ff;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .sr-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .sr-card p { margin: 0; color: #64748b; font-size: .9rem; }
    .sr-empty { color: #64748b; padding: 24px 0; }
  </style>
</head>
<body class="landing-page">
  <div class="sr-wrap">
    <div class="sr-head">
      <div>
        <a href="dashboard.html" style="font-size: .9rem">← Mon espace</a>
        <h1>Recherche dans mon dossier</h1>
      </div>
      <a href="profile.html" style="font-size: .9rem">Profil</a>
    </div>
    <p style="color: #64748b; font-size: .95rem; margin-top: 0">
      Recherche dans votre dossier — inspire <code>/dashboard/external/search</code> multisite (filtrez demandes, devis, contrats, sinistres, véhicules).
    </p>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
      <label for="srQuery" class="sr-only" style="position:absolute;left:-9999px">Rechercher</label>
      <input type="search" id="srQuery" class="sr-query" style="margin-bottom:0;flex:1" placeholder="Rechercher par nom, contrat, sinistre, immatriculation…" autocomplete="off" />
      <button type="button" id="srClear" style="padding:12px 16px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;cursor:pointer;font-weight:600;color:#64748b">Effacer</button>
    </div>
    <div id="srMeta"></div>
    <div id="srResults"></div>
  </div>
  <script src="../js/cookie-banner.js"></script>
  <script src="search.js"></script>
</body>
</html>
