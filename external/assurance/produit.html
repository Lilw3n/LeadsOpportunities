<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assurance | Leads Opportunities</title>
  <link rel="stylesheet" href="../../landings/styles.css" />
  <style>
    .product-hero { color: #fff; padding: 56px 24px; text-align: center; position:relative; overflow:hidden; }
    .product-hero:before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.2),transparent 28rem); pointer-events:none; }
    .product-hero > * { position:relative; }
    .product-back { color: rgba(255,255,255,.9); display: inline-flex; margin-bottom: 16px; text-decoration:none; font-weight:700; }
    .product-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
    .product-hero h1 { margin:0 0 12px; font-size:clamp(2rem,4vw,3.35rem); letter-spacing:-.04em; }
    .product-hero p { max-width:720px; margin:0 auto; color:rgba(255,255,255,.88); line-height:1.65; }
    .product-cta { display: inline-flex; margin-top: 20px; padding: 14px 24px; background: #fff; color: #111; border-radius: 999px; font-weight: 800; text-decoration: none; box-shadow:0 12px 28px rgba(15,23,42,.18); }
    .product-main { max-width: 940px; margin: 0 auto; padding: 32px 24px; display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.72fr); gap:18px; }
    .product-panel { background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:22px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
    .product-panel p { color:#64748b; line-height:1.6; }
    .product-features { list-style: none; padding: 0; }
    .product-features li { padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    @media (max-width:820px) { .product-main { grid-template-columns:1fr; } }
  </style>
</head>
<body class="landing-page">
  <div id="productRoot"></div>
  <script src="../../js/external-product-page.js"></script>
  <script>
    var slug = new URLSearchParams(location.search).get("p") || "sante";
    document.addEventListener("DOMContentLoaded", function () {
      window.ExternalProductPage.render(slug);
    });
  </script>
</body>
</html>
