<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test éligibilité | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./crm-contact.css" />
  <style>
    .contact-pick { margin-top: 12px; padding: 16px; background: #f8fafc; border-radius: 14px; border: 1px solid var(--line); }
  </style>
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Assurance métier</p>
      <h2>Test d'éligibilité rapide</h2>
      <p>Saisissez les critères une fois et vérifiez la compatibilité avec vos partenaires avant d'envoyer un devis.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-eligibility-rules.html" class="btn btn-ghost">Règles</a>
      <a href="./crm-partners.html" class="btn btn-ghost">Partenaires</a>
      <a href="./crm-intelligent-alerts.html" class="btn btn-primary">Alertes</a>
    </div>
  </section>
  <section class="crm-page-panel contact-pick">
    <label>Préremplir depuis un contact (optionnel)
      <input type="search" id="contactPick" placeholder="Rechercher email, nom…" class="crm-input" style="margin-top:8px" />
    </label>
    <div id="contactPickResults"></div>
  </section>
  <div class="panel" id="eligFormBox"></div>
  <div id="eligResultsBox" class="panel" style="margin-top:16px"></div>
  <script src="./js/partner-eligibility.js"></script>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-eligibility-test.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
