<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modèles de projets | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Dossiers</p>
      <h2>Modèles de projets</h2>
      <p>Démarrez plus vite avec des structures de dossier réutilisables.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-projects.html" class="btn btn-ghost">Tous les projets</a>
    </div>
  </section>
  <div id="tplGrid" class="crm-module-grid"></div>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script>
    if (!localStorage.getItem("lo_token")) location.href = "./crm.html";
    var templates = [
      { name: "Onboarding client VTC", desc: "KYC, véhicule, devis, signature", href: "./crm-create-complete.html" },
      { name: "Renouvellement annuel", desc: "Période, contrats, relances", href: "./crm-periods.html" },
      { name: "Gestion sinistre", desc: "Déclaration, suivi, clôture", href: "./crm-claims.html" },
    ];
    document.getElementById("tplGrid").innerHTML = templates
      .map(function (t) {
        return '<a class="crm-module-card" href="' + t.href + '"><strong>' + t.name + "</strong><span>" + t.desc + "</span></a>";
      })
      .join("");
  </script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
