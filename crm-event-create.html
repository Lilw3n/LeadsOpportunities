<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouvel événement | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Agenda</p>
      <h2>Créer un événement</h2>
      <p>Planifiez un appel, RDV ou tâche rattachée à un contact du portefeuille.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-events.html" class="btn btn-ghost">Événements</a>
      <a href="./crm-calendar.html" class="btn btn-ghost">Calendrier</a>
    </div>
  </section>

  <section class="crm-page-panel">
    <form id="evForm" class="panel">
      <label class="crm-label">ID contact *
        <input name="contactId" class="crm-input" required placeholder="ct_…" pattern="ct_[a-zA-Z0-9_-]+" />
      </label>
      <label class="crm-label" style="margin-top:12px;display:block">Titre *
        <input name="title" class="crm-input" required />
      </label>
      <label class="crm-label" style="margin-top:12px;display:block">Type
        <select name="eventType" class="crm-input">
          <option value="call">Appel</option>
          <option value="meeting">RDV</option>
          <option value="email">Email</option>
          <option value="task">Tâche</option>
          <option value="note">Note</option>
        </select>
      </label>
      <label class="crm-label" style="margin-top:12px;display:block">Date *
        <input type="date" name="eventDate" class="crm-input" required />
      </label>
      <label class="crm-label" style="margin-top:8px;display:block">Ou saisie manuelle (JJ/MM/AAAA)
        <input
          type="text"
          name="eventDateText"
          class="crm-input"
          inputmode="numeric"
          placeholder="ex. 28/05/2026"
          autocomplete="off"
        />
      </label>
      <p style="margin:6px 0 0;color:var(--muted);font-size:.85rem">
        Astuce: tu peux ecrire directement la date, sans ouvrir le calendrier.
      </p>
      <label class="crm-label" style="margin-top:12px;display:block">Priorité
        <select name="priority" class="crm-input">
          <option value="medium">Moyenne</option>
          <option value="high">Haute</option>
          <option value="urgent">Urgente</option>
          <option value="low">Faible</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary" style="margin-top:16px">Créer</button>
    </form>
    <p id="evMsg" style="margin-top:12px;color:#b91c1c"></p>
  </section>

  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./js/crm-prefill-contact-id.js"></script>
  <script src="./crm-event-create.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
