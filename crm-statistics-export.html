<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exports statistiques | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Exports</p>
      <h2>Sortir les données utiles en CSV</h2>
      <p>Exports simples pour vérifier, partager ou retraiter les indicateurs CRM sans inventer de chiffres.</p>
    </div>
    <div class="crm-action-row">
      <a class="btn btn-ghost" href="./crm-statistics.html">Statistiques</a>
      <a class="btn btn-ghost" href="./crm-statistics-reports.html">Rapports</a>
    </div>
  </section>
  <div class="panel" style="display:grid;gap:12px;max-width:560px">
    <button type="button" class="btn btn-primary" id="btnExportStats">Résumé statistiques</button>
    <button type="button" class="btn btn-ghost" id="btnExportContacts">Contacts (liste)</button>
    <button type="button" class="btn btn-ghost" id="btnExportQuotes">Devis</button>
    <p id="exportMsg" style="font-size:.9rem;color:var(--muted)"></p>
  </div>
  <script src="./js/crm-export.js"></script>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-statistics-export.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
