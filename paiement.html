<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement securise | Leads Opportunities</title>
  <meta name="description" content="Reglez votre acompte de demande en paiement securise via Stripe." />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JX8E35693F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JX8E35693F');
  </script>
  <script src="/api/google-config-env"></script>
  <script src="./google-config.js"></script>
  <link rel="stylesheet" href="./main.css" />
</head>
<body>
  <main class="container section">
    <p><a href="./index.html">Retour accueil</a></p>
    <section class="card">
      <h1>Paiement securise</h1>
      <p class="sub">Reglez un acompte pour lancer le traitement prioritaire de votre dossier.</p>
      <p class="sub">Contact : <a href="./index.html#contact">Nous contacter</a></p>

      <form id="paymentForm" class="contact-form">
        <select id="category" required>
          <option value="">Categorie</option>
          <option value="mobilite_pro">Mobilite Pro (VTC/Flotte)</option>
          <option value="sante_prevoyance">Sante / Prevoyance</option>
          <option value="habitat_finance">Habitat / Finance</option>
        </select>
        <input id="email" type="email" placeholder="Email client" required />
        <input id="referenceId" type="text" placeholder="Reference dossier (optionnel)" />
        <input id="amountEur" type="number" step="0.01" min="1" placeholder="Montant EUR (ex: 49)" required />
        <button class="btn btn-primary" type="submit">Payer avec Stripe</button>
      </form>

      <p id="paymentMsg" class="ok" hidden></p>
    </section>
  </main>

  <script src="./paiement.js"></script>
</body>
</html>
