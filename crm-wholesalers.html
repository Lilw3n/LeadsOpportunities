<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grossistes | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <style>
    .wh-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:16px; }
    .wh-card { border:1px solid var(--line); border-radius:12px; padding:18px; background:#fff; }
    .wh-card.verified { border-color:#10b981; }
    .wh-card.doubtful { border-color:#f59e0b; opacity:.9; }
    .wh-badge { font-size:.75rem; padding:3px 8px; border-radius:999px; background:#e2e8f0; }
    .wh-badge.ok { background:#d1fae5; color:#065f46; }
    .wh-badge.warn { background:#fef3c7; color:#92400e; }
  </style>
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Partenaires</p>
      <h2>Registre grossistes</h2>
      <p>Comparez les offreurs VTC, santé et flotte — accès extranet et test d'éligibilité avant proposition client.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-partners.html" class="btn btn-ghost">Partenaires</a>
      <a href="./crm-eligibility-test.html" class="btn btn-primary">Test éligibilité</a>
    </div>
  </section>

  <section class="crm-page-panel">
    <input type="search" id="whSearch" class="crm-input" placeholder="Rechercher un grossiste…" style="max-width:400px" />
    <div class="crm-filter-chips" id="filters" style="margin-top:12px">
      <button type="button" class="crm-filter-chip active" data-f="all">Tous</button>
      <button type="button" class="crm-filter-chip" data-f="verified">Vérifiés</button>
      <button type="button" class="crm-filter-chip" data-f="vtc">VTC</button>
      <button type="button" class="crm-filter-chip" data-f="sante">Santé</button>
    </div>
    <div class="wh-grid" id="whMount"></div>
  </section>

  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./js/crm-wholesalers-data.js"></script>
  <script src="./crm-wholesalers.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
