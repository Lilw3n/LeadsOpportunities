<body class="partner-hub-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../">Leads Opportunities</a>
      <button
        type="button"
        class="hamburger"
        id="partnerHubMenuBtn"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="partnerHubMenu"
      >
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links partner-hub-nav" id="partnerHubMenu" aria-label="Navigation">
        <a href="../nos-services.html">Services</a>

        <a class="btn btn-primary btn-sm" href="../#contact">Devis</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="partner-hub-intro">
      <div class="container partner-hub-intro-inner">
        <p class="section-badge">Partenaires locaux</p>
        <h1>Les sites de nos partenaires</h1>
        <p class="partner-hub-lead">
          Filtrez par métier. Chaque fiche ouvre le site du partenaire — pensé pour mobile comme pour desktop.
        </p>
      </div>
    </section>
    <section data-partner-sites data-layout="hub" data-src="../data/partner-sites.json"></section>

  <script>
    (function () {
      var btn = document.getElementById("partnerHubMenuBtn");
      var menu = document.getElementById("partnerHubMenu");
      if (!btn || !menu) return;
      btn.addEventListener("click", function () {
        var open = menu.classList.toggle("is-open");
        btn.classList.toggle("is-open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
