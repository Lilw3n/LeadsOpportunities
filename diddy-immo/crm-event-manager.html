<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gestionnaire d’événements | CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
  <link rel="stylesheet" href="./css/interlocuteur-dossier.css" />
  <link rel="stylesheet" href="./crm-event-manager.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Suivi dossiers</p>
      <h2>Gestionnaire d’événements</h2>
      <p>Relances, RDV et pièces — avec chaque interlocuteur important du dossier (client, banque, notaire, partenaire, apporteur…).</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-event-create.html" class="btn btn-primary">Nouvel événement</a>
      <a href="./crm-calendar.html" class="btn btn-ghost">Agenda</a>
      <a href="./crm-events.html" class="btn btn-ghost">Liste brute</a>
      <a href="./crm-interlocutors.html" class="btn btn-ghost">Interlocuteurs</a>
      <a href="./crm-todoist.html" class="btn btn-ghost">Todoist</a>
      <a href="./crm-pubs.html" class="btn btn-ghost">Slack</a>
    </div>
  </section>

  <div class="int-slack-bar" id="emTodoistBar">
    <span class="int-slack-dot" id="emTodoistDot"></span>
    <span id="emTodoistStatus">Todoist…</span>
    <button type="button" class="btn btn-ghost btn-sm" id="emTodoistSync">Synchroniser les événements</button>
    <a href="./crm-todoist.html" class="btn btn-ghost btn-sm">Ouvrir Todoist</a>
  </div>

  <div class="int-slack-bar" id="emSlackBar">
    <span class="int-slack-dot" id="emSlackDot"></span>
    <span id="emSlackStatus">Slack…</span>
    <button type="button" class="btn btn-ghost btn-sm" id="emSlackTest">Tester Slack</button>
    <a href="./crm-pubs.html" class="btn btn-ghost btn-sm">Configurer</a>
  </div>

  <div class="acq-stats" id="emKpis"></div>

  <div class="crm-toolbar acq-toolbar em-toolbar">
    <input type="search" id="emSearch" class="crm-input" placeholder="Dossier, titre, interlocuteur…" />
    <select id="emView" class="crm-input">
      <option value="planning">Planning</option>
      <option value="interlocutors">Par interlocuteur</option>
      <option value="dossiers">Par dossier</option>
    </select>
    <select id="emStatus" class="crm-input">
      <option value="open">Ouverts (à faire)</option>
      <option value="pending">En attente</option>
      <option value="completed">Terminés</option>
      <option value="">Tous</option>
    </select>
  </div>

  <section class="panel em-section">
    <h2>Interlocuteurs à suivre</h2>
    <div class="crm-filter-chips" id="emRoleChips"></div>
  </section>

  <div id="emBoard" class="em-board"></div>

  <script src="./js/crm-agenda-types.js"></script>
  <script src="./js/crm-dossier-interlocutors.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-event-manager.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
