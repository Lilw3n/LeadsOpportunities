<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau paiement | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Finance</p>
      <h2>Nouveau paiement</h2>
      <p>Saisie manuelle d'un encaissement client — visible dans la liste des paiements.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-financial-payments.html" class="btn btn-ghost">Liste paiements</a>
      <a href="./crm-financial.html" class="btn btn-primary">Hub financier</a>
    </div>
  </section>
  <section class="crm-page-panel">
    <form id="payForm" class="panel">
      <label class="crm-label">Libellé<input name="label" class="crm-input" required /></label>
      <label class="crm-label" style="margin-top:12px;display:block">Montant (€)<input type="number" name="amount" class="crm-input" min="0" step="0.01" required /></label>
      <label class="crm-label" style="margin-top:12px;display:block">Statut
        <select name="status" class="crm-input"><option value="Confirmé">Confirmé</option><option value="En attente">En attente</option></select>
      </label>
      <label class="crm-label" style="margin-top:12px;display:block">ID contact (optionnel)<input name="contactId" class="crm-input" placeholder="ct_…" pattern="ct_[a-zA-Z0-9_-]*" /></label>
      <button type="submit" class="btn btn-primary" style="margin-top:16px">Enregistrer</button>
    </form>
  </section>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./js/crm-prefill-contact-id.js"></script>
  <script src="./crm-financial-payment-new.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
