<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau paiement | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>

  <a href="./crm-financial-payments.html" class="btn btn-ghost">← Paiements</a>
  <h1>+ Nouveau paiement</h1>
  <p style="color:var(--muted)">Inspire encaissement manuel multisite — visible dans la liste paiements.</p>
  <form id="payForm" class="panel">
    <label style="display:block">Libellé<input name="label" required style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px" /></label>
    <label style="display:block;margin-top:12px">Montant (€)<input type="number" name="amount" min="0" step="0.01" required style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px" /></label>
    <label style="display:block;margin-top:12px">Statut<select name="status" style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px">
      <option value="Confirmé">Confirmé</option>
      <option value="En attente">En attente</option>
    </select></label>
    <label style="display:block;margin-top:12px">ID contact (optionnel)<input name="contactId" placeholder="ct_..." style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px" /></label>
    <button type="submit" class="btn btn-primary" style="margin-top:16px">Enregistrer</button>
  </form>
    <script src="./js/crm-prefill-contact-id.js"></script>
<script src="./crm-financial-payment-new.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
