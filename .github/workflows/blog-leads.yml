name: Publication articles leads

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build scheduled lead articles
        run: npm run blog:scheduled

      - name: Commit generated articles
        run: |
          if git diff --quiet -- blog data; then
            echo "Aucun nouvel article a publier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog data
          git commit -m "blog: publie les articles leads planifies"
          git push
