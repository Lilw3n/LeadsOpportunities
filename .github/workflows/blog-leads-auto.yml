name: Blog leads auto (evergreen conversion)

on:
  schedule:
    # 3x/semaine UTC — contenus evergreen orientes questionnaire
    - cron: "30 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre d'articles lead (1-3)"
        required: false
        default: "1"

concurrency:
  group: blog-leads-auto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-lead-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auto publish evergreen lead article
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          npm run blog:leads:auto -- --count="$COUNT"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            git add data/blog-lead-*.json data/blog-actu-*.json blog/*.html sitemap*.xml seo/
            git commit -m "chore(blog): lead article auto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Aucun changement a committer."
          fi
