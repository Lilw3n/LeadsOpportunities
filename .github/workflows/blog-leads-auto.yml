name: Blog leads evergreen auto

on:
  schedule:
    # 1 article evergreen par jour ouvrable, en dehors des crons actu.
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre d'articles (1-5)"
        required: false
        default: "1"
      topic:
        description: "Slug exact d'un sujet a publier (optionnel)"
        required: false
        default: ""

concurrency:
  group: blog-leads-auto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate evergreen lead article
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          if [ -n "$TOPIC" ]; then
            npm run blog:leads:auto -- --count="$COUNT" --topic="$TOPIC"
          else
            npm run blog:leads:auto -- --count="$COUNT"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/blog-lead-*.json data/blog-actu-*.json blog/*.html sitemap*.xml seo/
            git commit -m "chore(blog): evergreen lead article $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Aucun changement a committer."
          fi
