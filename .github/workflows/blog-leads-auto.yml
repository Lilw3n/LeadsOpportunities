name: Blog leads evergreen auto

on:
  schedule:
    # 3 publications evergreen par semaine, en complement du flux actu.
    - cron: "30 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre d'articles evergreen (1-3)"
        required: false
        default: "1"
      section:
        description: "Section optionnelle: sante, habitat, auto, finance, prevoyance, pro, animaux, vtc"
        required: false
        default: ""

concurrency:
  group: blog-leads-evergreen-auto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auto publish evergreen lead articles
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          SECTION="${{ github.event.inputs.section || '' }}"
          if [ -n "$SECTION" ]; then
            npm run blog:leads:auto -- --count="$COUNT" --section="$SECTION"
          else
            npm run blog:leads:auto -- --count="$COUNT"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            git add data/blog-lead-*.json data/blog-actu-*.json blog/*.html blog/feed.xml sitemap*.xml seo/
            git commit -m "chore(blog): lead evergreen auto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Aucun changement a committer."
          fi
