name: Publish scheduled blog articles

on:
  schedule:
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      publish_date:
        description: "Date de publication a simuler (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish due articles
        env:
          BLOG_PUBLISH_DATE: ${{ inputs.publish_date }}
        run: npm run blog:publish

      - name: Commit generated article pages
        run: |
          if git diff --quiet; then
            echo "No scheduled blog article to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog data sitemap.xml package.json package-lock.json scripts .github/workflows
          git commit -m "Publish scheduled blog articles"
          git push
