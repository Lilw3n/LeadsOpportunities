# Crée les formulaires Meta Lead Ads via Graph API (contournement si UI Vercel buggée).
# Secrets GitHub requis : Settings → Secrets and variables → Actions
#   META_PAGE_ACCESS_TOKEN (obligatoire)
#   META_PAGE_ID (optionnel, défaut 1183829618147455)
name: Meta Lead Ads — créer formulaires

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation seulement (--dry-run)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  meta-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifier token Meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "::error::Secret GitHub META_PAGE_ACCESS_TOKEN manquant."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Token présent (${#META_PAGE_ACCESS_TOKEN} caractères)"

      - name: Test Graph API (page)
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          PAGE_ID="${META_PAGE_ID:-1183829618147455}"
          RESP=$(curl -sS "https://graph.facebook.com/v20.0/${PAGE_ID}?fields=id,name&access_token=${META_PAGE_ACCESS_TOKEN}")
          echo "$RESP" | head -c 500
          echo "$RESP" | grep -q '"error"' && exit 1 || true

      - name: Créer formulaires Meta (Graph API)
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run meta:forms:plan
          else
            npm run meta:forms:create
          fi

      - name: Commit form_id si changements
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/meta-lead-forms.json data/meta-lead-forms-created.json data/meta-blog-form-ranking.json
          if git diff --staged --quiet; then
            echo "Aucun form_id nouveau"
            exit 0
          fi
          git commit -m "chore(meta): form_id Lead Ads via GitHub Actions"
          git push
