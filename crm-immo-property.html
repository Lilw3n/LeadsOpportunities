<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fiche bien intelligente | CRM Immobilier</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
  <style>
    :root { --immo-blue:#1e4f8a; --immo-side:#2c3340; }
    .dossier-head { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .dossier-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .dossier-tabs button {
      border:1px solid var(--line); background:#fff; color:#334155; padding:8px 12px; border-radius:8px;
      font-weight:700; font-size:.78rem; letter-spacing:.02em; text-transform:uppercase; cursor:pointer;
    }
    .dossier-tabs button.active { background:var(--immo-blue); color:#fff; border-color:var(--immo-blue); }
    .dossier-layout { display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start; }
    @media (max-width:900px){ .dossier-layout { grid-template-columns:1fr; } }
    .dossier-side {
      background:var(--immo-side); color:#fff; border-radius:12px; padding:8px; position:sticky; top:10px;
      max-height:calc(100vh - 24px); overflow:auto;
    }
    .dossier-side button {
      width:100%; text-align:left; border:0; background:transparent; color:#e2e8f0; padding:10px 12px;
      border-radius:8px; font-weight:700; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
      display:flex; justify-content:space-between; align-items:center;
    }
    .dossier-side button:hover { background:#3a4454; }
    .dossier-side button.active { background:var(--immo-blue); color:#fff; }
    .dossier-side button .chev { opacity:.5; }
    .dossier-main { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-height:420px; }
    .dossier-main h3 { margin:0 0 6px; color:var(--immo-blue); }
    .dossier-hint { color:var(--muted); font-size:.82rem; margin:0 0 14px; }
    .field-row {
      display:grid; grid-template-columns:minmax(160px,280px) 1fr; gap:10px; align-items:start;
      padding:8px 0; border-bottom:1px solid #eef2f7;
    }
    @media (max-width:700px){ .field-row { grid-template-columns:1fr; } }
    .field-row label {
      font-size:.82rem; font-weight:700; font-style:italic; color:var(--immo-blue); padding-top:8px;
    }
    .field-row label.important { color:#0b3d91; }
    .field-ctrl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .field-ctrl input, .field-ctrl select, .field-ctrl textarea {
      flex:1; min-width:140px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
      background:#f8fafc; font:inherit;
    }
    .field-ctrl textarea { min-height:72px; width:100%; }
    .field-unit { color:var(--muted); font-size:.8rem; font-weight:700; }
    .tri { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .tri button { border:0; background:#fff; padding:6px 10px; cursor:pointer; color:#64748b; }
    .tri button.active-yes { background:#dcfce7; color:#166534; }
    .tri button.active-no { background:#fee2e2; color:#991b1b; }
    .tri button.active-any { background:#e2e8f0; color:#0f172a; }
    .smart-banner {
      background:#eff6ff; border:1px solid #bfdbfe; color:#1e3a8a; border-radius:10px; padding:10px 12px;
      font-size:.84rem; margin-bottom:12px;
    }
    .unit-card {
      border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#f8fafc;
    }
    .unit-card h4 { margin:0 0 8px; font-size:.95rem; }
    .unit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
    .unit-grid label { display:flex; flex-direction:column; gap:4px; font-size:.72rem; font-weight:700; color:var(--muted); font-style:normal; }
    .doc-group { margin-bottom:18px; }
    .doc-group h4 { margin:0 0 8px; color:#b91c1c; font-size:.9rem; }
    .doc-table { width:100%; border-collapse:collapse; font-size:.84rem; }
    .doc-table th, .doc-table td { padding:7px 8px; border-bottom:1px solid #eef2f7; text-align:left; }
    .doc-table th { color:var(--muted); font-size:.72rem; }
    .meta-bar { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:12px; }
    .meta-bar label { display:flex; flex-direction:column; gap:4px; font-size:.75rem; font-weight:700; color:var(--muted); }
    .meta-bar input, .meta-bar select { padding:8px 10px; border-radius:8px; border:1px solid var(--line); font:inherit; }
    .save-bar { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .party-row { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
    .party-actions, .party-form-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .party-summary { margin:10px 0 14px; padding:9px 10px; border-radius:8px; background:#eff6ff; color:#1e3a8a; font-size:.82rem; }
    .party-group { margin:16px 0; }
    .party-group h4 { margin:0; color:var(--immo-blue); font-size:.9rem; }
    .party-group h4 span { color:var(--muted); font-weight:500; }
    .party-form {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin-top:18px;
      padding-top:14px; border-top:2px solid var(--immo-blue);
    }
    .party-form label { display:flex; flex-direction:column; gap:4px; font-size:.75rem; font-weight:700; color:var(--muted); }
    .party-form input, .party-form select { padding:8px 10px; border-radius:8px; border:1px solid var(--line); font:inherit; }
    @media (max-width:600px) {
      .party-row { flex-direction:column; }
      .party-actions { align-self:flex-start; }
    }
    .immo-hint { color:var(--muted); font-size:.82rem; margin:8px 0; }
    .immo-field { display:flex; flex-direction:column; gap:4px; font-size:.8rem; font-weight:700; color:var(--muted); margin-bottom:10px; }
    .immo-img-layout { display:grid; grid-template-columns:200px 1fr; gap:14px; }
    @media (max-width:800px){ .immo-img-layout { grid-template-columns:1fr; } }
    .immo-img-side { display:flex; flex-direction:column; gap:6px; }
    .immo-img-cat { text-align:left; border:1px solid var(--line); background:#fff; padding:10px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:.78rem; }
    .immo-img-cat.is-active { background:var(--immo-blue); color:#fff; border-color:var(--immo-blue); }
    .immo-img-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .immo-inline { display:flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; color:var(--muted); }
    .immo-img-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .immo-img-card { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#f8fafc; }
    .immo-img-card img { width:100%; height:120px; object-fit:cover; display:block; }
    .immo-img-ph { height:120px; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#e2e8f0; }
    .immo-img-actions { display:flex; gap:4px; padding:6px; }
    .immo-cloud-head { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .immo-cloud-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .immo-cloud-folders { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .immo-cloud-folder-btn { border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:.78rem; font-weight:700; }
    .immo-cloud-folder-btn.is-active { background:var(--immo-blue); color:#fff; border-color:var(--immo-blue); }
    .immo-cloud-table { width:100%; border-collapse:collapse; font-size:.84rem; }
    .immo-cloud-table th, .immo-cloud-table td { padding:8px; border-bottom:1px solid #eef2f7; text-align:left; }
    .immo-cloud-table th { color:var(--muted); font-size:.72rem; }
</head>
<body class="crm-subpage">
  <div class="dossier-head">
    <div>
      <p class="crm-eyebrow">Immobilier · fiche intelligente</p>
      <h2 id="propTitle">Bien</h2>
      <p id="propSub" style="color:var(--muted);margin:0"></p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-immo-properties.html" class="btn btn-ghost">← Piges</a>
      <a href="./crm-immo-matching.html" class="btn btn-ghost">Matching</a>
      <a id="linkAgenda" class="btn btn-ghost" href="./crm-event-create.html">+ RDV agenda</a>
      <a id="linkFinancement" class="btn btn-ghost" href="./crm-agency-fees.html">Financement / prêt</a>
      <a id="linkAnnonce" class="btn btn-ghost" target="_blank" rel="noopener" hidden>Annonce</a>
      <button type="button" class="btn btn-primary" id="btnSave">Enregistrer</button>
    </div>
  </div>

  <div class="dossier-tabs" id="topTabs"></div>

  <div class="meta-bar" id="metaBar">
    <label>Titre<input id="mTitle" /></label>
    <label>Type<select id="mType"></select></label>
    <label>Transaction<select id="mTransaction"></select></label>
    <label>Statut
      <select id="mStatus"></select>
    </label>
    <label>Origine<select id="mSource"></select></label>
    <label>URL annonce<input id="mUrl" placeholder="https://…" /></label>
  </div>

  <div id="tabDescription">
    <div class="dossier-layout">
      <nav class="dossier-side" id="sideNav"></nav>
      <div class="dossier-main">
        <div class="smart-banner" id="smartBanner"></div>
        <h3 id="sectionTitle">Section</h3>
        <p class="dossier-hint" id="sectionHint"></p>
        <div id="sectionBody"></div>
        <div class="save-bar">
          <button type="button" class="btn btn-primary" id="btnSave2">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tabOther" hidden>
    <section class="panel" id="otherPanel"></section>
  </div>

  <script src="./js/crm-immo-matcher.js"></script>
  <script src="./js/crm-immo-store.js"></script>
  <script src="./js/crm-immo-property-schema.js"></script>
  <script src="./js/crm-immo-cloud.js"></script>
  <script src="./js/finance-deep-link.js"></script>
  <script src="./js/crm-immo-property-page.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
