<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentification | AssuranceLeads</title>
  <meta name="description" content="Inscription, connexion, mot de passe et identification Google." />
  <link rel="stylesheet" href="./main.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="logo" href="./index.html">AssuranceLeads</a>
      <nav>
        <a href="./index.html">Accueil</a>
        <a class="cta-link" href="./admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>Mon compte</h1>
    <p class="sub">Inscris-toi, connecte-toi, change ton mot de passe ou utilise Google.</p>

    <div class="grid3">
      <section class="card">
        <h3>Inscription</h3>
        <form id="signupForm">
          <p><input type="email" id="signupEmail" placeholder="Email" required /></p>
          <p><input type="password" id="signupPassword" placeholder="Mot de passe" required /></p>
          <button class="btn btn-primary" type="submit">S'inscrire</button>
        </form>
      </section>

      <section class="card">
        <h3>Connexion</h3>
        <form id="loginForm">
          <p><input type="email" id="loginEmail" placeholder="Email" required /></p>
          <p><input type="password" id="loginPassword" placeholder="Mot de passe" required /></p>
          <button class="btn btn-primary" type="submit">Se connecter</button>
        </form>
        <p style="margin-top:10px;">
          <button class="btn btn-ghost" id="googleBtn" type="button">Continuer avec Google</button>
        </p>
      </section>

      <section class="card">
        <h3>Changer le mot de passe</h3>
        <form id="passwordForm">
          <p><input type="password" id="oldPassword" placeholder="Ancien mot de passe" required /></p>
          <p><input type="password" id="newPassword" placeholder="Nouveau mot de passe" required /></p>
          <button class="btn btn-primary" type="submit">Mettre à jour</button>
        </form>
      </section>
    </div>

    <section class="contact" style="margin-top:16px;">
      <h3>Session</h3>
      <p id="sessionState">Aucune session active.</p>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Se déconnecter</button>
    </section>

    <p id="authMessage" class="ok" hidden></p>
  </main>

  <script src="./auth.js"></script>
</body>
</html>
