<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utilisateurs internes | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Équipe</p>
      <h2>Utilisateurs internes</h2>
      <p>Comptes courtiers, commerciaux et administrateurs — accès CRM et périmètre contacts.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-permissions.html" class="btn btn-ghost">Permissions</a>
      <a href="./crm-roles.html" class="btn btn-ghost">Rôles</a>
    </div>
  </section>

  <section class="crm-page-panel" id="adminOnlyCreate" hidden>
    <div class="crm-section-head"><h2>Créer un compte</h2></div>
    <form id="userForm" class="panel">
      <label class="crm-label">Email<input type="email" name="email" class="crm-input" required /></label>
      <label class="crm-label" style="margin-top:10px;display:block">Mot de passe<input type="password" name="password" class="crm-input" minlength="8" required /></label>
      <label class="crm-label" style="margin-top:10px;display:block">Nom<input name="fullName" class="crm-input" /></label>
      <label class="crm-label" style="margin-top:10px;display:block">Rôle CRM
        <select name="crmRole" class="crm-input">
          <option value="commercial">Commercial</option>
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
          <option value="apporteur">Apporteur</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary" style="margin-top:12px">Créer</button>
    </form>
    <p id="userMsg" style="margin-top:8px"></p>
  </section>

  <section class="crm-page-panel">
    <div class="crm-section-head"><h2>Équipe</h2></div>
    <div id="usersMount">Chargement…</div>
  </section>

  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./js/crm-admin-guard.js"></script>
  <script src="./crm-users-internal.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
