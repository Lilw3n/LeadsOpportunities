<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devis CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>

  <a href="./crm.html" class="btn btn-ghost">← CRM</a>
  <h1>Devis CRM</h1>
  <p style="color:var(--muted)">Inspire dashboard/quotes multisite-platform</p>
  <div class="panel" style="margin:16px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <a href="./crm-quote-new.html" class="btn btn-primary">+ Devis simple (wizard)</a>
    <a href="./crm-quote-contract-wizard.html" class="btn btn-ghost">Assistant devis → contrat</a>
    <button type="button" class="btn btn-ghost" id="btnNewQuote">+ Devis rapide</button>
    <a href="./crm-ai-suggestions.html" class="btn btn-ghost">Assistant IA</a>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px" id="quoteFilters">
    <button type="button" class="btn btn-ghost btn-sm active" data-st="">Tous</button>
    <button type="button" class="btn btn-ghost btn-sm" data-st="draft">Brouillon</button>
    <button type="button" class="btn btn-ghost btn-sm" data-st="sent">Envoyé</button>
    <button type="button" class="btn btn-ghost btn-sm" data-st="accepted">Accepté</button>
    <button type="button" class="btn btn-ghost btn-sm" data-st="expired">Expiré</button>
  </div>
  <div id="quotesList" class="panel"></div>
  <div id="quoteModal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:520px">
      <h2>Nouveau devis</h2>
      <form id="quoteForm" class="form-grid">
        <label class="full">ID contact<input name="contactId" required placeholder="ct_..." /></label>
        <label>Produit<select name="productType"><option value="vtc-taxi">VTC / Taxi</option><option value="auto">Auto</option><option value="sante">Sante</option><option value="habitation">Habitation</option></select></label>
        <label>Titre<input name="title" value="Devis" /></label>
        <label class="full">Notes<textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn btn-primary full">Creer</button>
      </form>
    </div>
  </div>
  <script src="./crm-quotes.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
