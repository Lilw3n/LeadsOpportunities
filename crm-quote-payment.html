<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement devis | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Finance</p>
      <h2>Acompte devis (Stripe)</h2>
      <p>Générez un lien de paiement sécurisé pour l'acompte d'un devis existant. Le montant est validé côté serveur à partir du devis.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-quotes.html" class="btn btn-ghost">Liste des devis</a>
      <a href="./crm-financial-payments.html" class="btn btn-ghost">Paiements</a>
    </div>
  </section>

  <section class="crm-page-panel" id="stripeAdminPanel" hidden>
    <div class="crm-section-head">
      <div>
        <p class="crm-eyebrow">Administration</p>
        <h2>Configuration Stripe</h2>
      </div>
    </div>
    <button type="button" class="btn btn-ghost" id="btnStripeReadiness">Vérifier Stripe</button>
    <pre id="stripeReadinessOut" class="panel" style="white-space:pre-wrap;margin-top:12px;font-size:.8rem"></pre>
  </section>

  <section class="crm-page-panel">
    <form id="payForm" class="panel">
      <p id="quoteHint" class="crm-muted-inline" style="margin:0 0 12px"></p>
      <label class="crm-label">Montant acompte (€)
        <input type="number" name="amount" class="crm-input" min="1" step="0.01" required />
      </label>
      <label class="crm-label" style="margin-top:12px;display:block">Email client
        <input type="email" name="email" class="crm-input" required autocomplete="email" />
      </label>
      <label class="crm-label" style="margin-top:12px;display:block">Référence devis
        <input name="reference" class="crm-input" placeholder="qte_…" pattern="qte_[a-zA-Z0-9_-]+" />
      </label>
      <button type="submit" class="btn btn-primary" style="margin-top:16px">Payer avec Stripe</button>
    </form>
    <p id="payMsg" style="margin-top:12px"></p>
  </section>

  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-quote-payment.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
