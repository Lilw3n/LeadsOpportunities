<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alertes intelligentes | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Pilotage</p>
      <h2>Alertes à traiter</h2>
      <p>Éligibilité, sinistres anciens, devis à relancer, événements en retard et renouvellements — priorisez ce qui bloque vos dossiers.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-eligibility-rules.html" class="btn btn-ghost">Règles d'éligibilité</a>
      <a href="./crm-eligibility-test.html" class="btn btn-ghost">Test éligibilité</a>
      <a href="./crm-periods.html" class="btn btn-primary">Périodes & renouvellements</a>
    </div>
  </section>

  <section class="crm-page-panel">
    <div class="crm-section-head">
      <div>
        <p class="crm-eyebrow">Filtrer</p>
        <h2>Par type d'alerte</h2>
      </div>
      <input type="search" id="alertSearch" class="crm-input" placeholder="Rechercher titre, message…" style="max-width:260px" />
    </div>
    <div class="crm-filter-chips" id="filters">
      <button type="button" class="crm-filter-chip active" data-f="all">Toutes</button>
      <button type="button" class="crm-filter-chip" data-f="eligibility">Éligibilité</button>
      <button type="button" class="crm-filter-chip" data-f="claim_aging">Sinistres</button>
      <button type="button" class="crm-filter-chip" data-f="reminder">Rappels</button>
      <button type="button" class="crm-filter-chip" data-f="event">Événements</button>
    </div>
    <p style="margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px">
      <button type="button" class="btn btn-ghost btn-sm" id="btnMarkAll">Tout marquer lu</button>
    </p>
    <div id="counts" class="crm-kpis"></div>
    <div id="alertMount"><div class="panel">Chargement…</div></div>
  </section>

  <script src="./js/crm-alerts-panel.js"></script>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-intelligent-alerts.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
