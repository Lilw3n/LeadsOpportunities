<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Migration projets | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Équipe</p>
      <h2>Migration projets</h2>
      <p>Importez des projets depuis un export JSON — utile pour reprise d'ancien CRM ou consolidation.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-projects.html" class="btn btn-ghost">Projets</a>
      <a href="./crm-projects-templates.html" class="btn btn-ghost">Modèles</a>
    </div>
  </section>
  <section class="crm-page-panel">
    <form id="migForm" class="panel">
      <label class="crm-label">JSON projets<textarea name="json" class="crm-input" rows="10" style="font-family:monospace;font-size:.85rem" placeholder='[{"name":"Projet X","type":"Assurance"}]'></textarea></label>
      <button type="submit" class="btn btn-primary" style="margin-top:12px">Importer</button>
    </form>
    <div id="migResult" style="margin-top:16px"></div>
  </section>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./js/crm-admin-guard.js"></script>
  <script src="./js/crm-projects.js"></script>
  <script>
    if (window.CrmAdminGuard) window.CrmAdminGuard.ensureAdmin("migResult");
    document.getElementById("migForm").onsubmit = function (e) {
      if (window.CrmAdminGuard && !window.CrmAdminGuard.isAdmin()) return;
      e.preventDefault();
      try {
        var incoming = JSON.parse(e.target.json.value);
        if (!Array.isArray(incoming)) throw new Error("Tableau JSON requis");
        var list = window.CrmProjects.load();
        incoming.forEach(function (p, i) {
          list.push({
            id: p.id || "proj-mig-" + Date.now() + "-" + i,
            name: p.name || "Projet importé",
            type: p.type || "Assurance",
            status: p.status || "active",
            priority: p.priority || "medium",
            updatedAt: new Date().toISOString(),
          });
        });
        window.CrmProjects.save(list);
        document.getElementById("migResult").innerHTML =
          '<div class="crm-empty-state"><h3>' + incoming.length + " projet(s) importé(s)</h3>" +
          '<p><a href="./crm-projects.html" class="btn btn-primary">Voir les projets</a></p></div>';
      } catch (err) {
        document.getElementById("migResult").innerHTML = '<p style="color:#b91c1c">' + err.message + "</p>";
      }
    };
  </script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
