<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau débit | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>

  <a href="./crm-financial-debits.html" class="btn btn-ghost">← Débits</a>
  <h1>+ Nouveau débit</h1>
  <p style="color:var(--muted)">Inspire débit fournisseur multisite — fusionné dans la liste débits.</p>
  <form id="debitForm" class="panel">
    <label style="display:block">Fournisseur / libellé<input name="label" required style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px" /></label>
    <label style="display:block;margin-top:12px">Montant (€)<input type="number" name="amount" min="0" step="0.01" required style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px" /></label>
    <label style="display:block;margin-top:12px">Statut<select name="status" style="width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px">
      <option value="Payé">Payé</option>
      <option value="En retard">En retard</option>
      <option value="En attente">En attente</option>
    </select></label>
    <button type="submit" class="btn btn-primary" style="margin-top:16px">Enregistrer</button>
  </form>
  <script src="./crm-financial-debit-new.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
