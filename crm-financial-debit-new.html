<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau débit | CRM</title>
  <link rel="stylesheet" href="./crm.css" />
  <link rel="stylesheet" href="./crm-ui.css" />
  <link rel="stylesheet" href="./css/admin-nav.css" />
</head>
<body class="crm-subpage">
  <section class="crm-page-panel crm-gradient-panel">
    <div>
      <p class="crm-eyebrow">Finance</p>
      <h2>Nouveau débit</h2>
      <p>Enregistrez une sortie fournisseur ou charge — suivi dans la liste des débits.</p>
    </div>
    <div class="crm-action-row">
      <a href="./crm-financial-debits.html" class="btn btn-ghost">Liste débits</a>
      <a href="./crm-financial.html" class="btn btn-primary">Hub financier</a>
    </div>
  </section>
  <section class="crm-page-panel">
    <form id="debitForm" class="panel">
      <label class="crm-label">Fournisseur / libellé<input name="label" class="crm-input" required /></label>
      <label class="crm-label" style="margin-top:12px;display:block">Montant (€)<input type="number" name="amount" class="crm-input" min="0" step="0.01" required /></label>
      <label class="crm-label" style="margin-top:12px;display:block">Statut
        <select name="status" class="crm-input"><option value="Payé">Payé</option><option value="En retard">En retard</option><option value="En attente">En attente</option></select>
      </label>
      <button type="submit" class="btn btn-primary" style="margin-top:16px">Enregistrer</button>
    </form>
  </section>
  <script src="./js/crm-sidebar.js"></script>
  <script src="./js/crm-subpage-shell.js"></script>
  <script src="./crm-financial-debit-new.js"></script>
  <script src="./js/admin-nav.js"></script>
</body>
</html>
